/* 8本の手描きロウソクの先端に火を正確に合わせる。右から1本ずつ灯る。 */
.cake-bob{overflow:visible}
.cake-bob .flame{
  top:7.4%;left:22.8%;width:8px;height:13px;opacity:0;
  transform-origin:50% 95%;transform:translate(-50%,-100%) rotate(-10deg);
  animation:none;filter:none;
  background:linear-gradient(170deg,#fffef0 5%,#fffbb0 35%,#ffce43 73%,#ff8b4a 95%);
  box-shadow:0 0 9px 2px #ffcf6288,0 0 2px #fff5af;
}

.book.opened .cake-bob .flame{opacity:0;animation:none;transition:none}
.book.cake-settled .cake-bob .flame{
  opacity:0;transition:none;
  animation:igniteCandle .32s cubic-bezier(.16,1.1,.3,1) var(--light-delay) both,
            steadyCandle .66s ease-in-out calc(var(--light-delay) + .32s) infinite alternate;
}
@keyframes igniteCandle{
  0%{opacity:0;transform:translate(-50%,-80%) scale(.1) rotate(-23deg)}
  50%{opacity:1;transform:translate(-50%,-103%) scale(1.35) rotate(-9deg)}
  100%{opacity:.96;transform:translate(-50%,-100%) scale(1) rotate(-15deg)}
}

  0%{transform:translate(-50%,-100%) scale(.89,1.1) rotate(-20deg);filter:brightness(1.08)}
  100%{transform:translate(-50%,-100%) scale(1.08,.88) rotate(-2deg);filter:brightness(.97)}

  .book.cake-settled .cake-bob .flame{animation:none!important;opacity:.96;transform:translate(-50%,-100%) rotate(-12deg)}

<main>
 
 <div class="book" id="book">
  <div class="page">
   <div class="top-ribbon">🌈 HAPPY BIRTHDAY 🌈</div>
   <h1 class="cute-title"><span class="title-star" aria-hidden="true">✦</span><span class="title-first">パパ、おたんじょうび</span><span class="title-second">おめでとう！</span><span class="title-star" aria-hidden="true">✦</span></h1>
   <div class="stage" aria-label="ゆずがかいたケーキとポムポムプリンがとび出します">
     <div class="pom-entry"><div class="pom-bob"><img class="art" src="./pom-cutout-v2.png" alt="ゆずがかいた、にっこりしたポムポムプリン"></div></div>
     <div class="cake-entry"><div class="cake-bob"><img class="art" src="./cake-cutout-v2.png" alt="ゆずがかいた、いちごやカラフルなろうそくのケーキ">
       <svg class="cake-cracker" viewBox="0 0 96 106" aria-label="ケーキが手に持ったクラッカー" role="img" xmlns="http://www.w3.org/2000/svg">
       <g transform="rotate(-9 45 60)">
        <path d="M11 91 Q17 66 40 44 L70 68 Q46 81 20 100 Z" fill="#ff9cc4" stroke="#86505a" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M20 87 43 53 52 61 31 94 Z" fill="#ffe37b"/>
        <path d="M34 77 54 58 61 64 44 83 Z" fill="#b5e7f6"/>
        <path d="M40 44 Q57 31 73 45 L79 59 Q78 67 70 68 Z" fill="#f2bde5" stroke="#86505a" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M72 45 Q82 41 83 55 Q87 64 79 59" fill="#fff4cc" stroke="#86505a" stroke-width="2.7"/>
        <path d="M49 28 53 12 M68 30 83 15 M81 39 94 32" stroke="#ffb44e" stroke-width="5.4" stroke-linecap="round"/>
       </g>
      </svg>
       <i class="flame"></i><i class="flame"></i><i class="flame"></i><i class="flame"></i><i class="flame"></i><i class="flame"></i><i class="flame"></i><i class="flame"></i>
     </div></div>
     <span class="spark s1">✨</span><span class="spark s2">💛</span><span class="spark s3">⭐</span><span class="spark s4">✨</span><span class="spark s5">💖</span><span class="spark s6">✨</span>
   </div>
   <div class="notes">
    <section class="note"><div class="who">🎂 ゆずから</div><p class="message">パパお誕生日おめでとう🎊<br>毎日お仕事がんばってね😏</p></section>
    <section class="note"><div class="who">💖 ママから</div><p class="message">誕生日おめでとう！<br>いつもありがとう💖</p></section>
   </div>
  </div>
  <button class="cover" id="cover" type="button" aria-label="カードをひらく">
    <span class="cover-top" aria-hidden="true"></span>
    <span class="cover-heart">✨</span>
    <span class="cover-main" aria-hidden="true"></span>
    <span class="cover-sub" aria-hidden="true"></span>
    <span class="touch">タッチして ひらいてね！</span>
  </button>
 </div>
 <button class="replay" id="replay" type="button" aria-label="もういちどカードをひらく">↻ もういっかい！</button>
 
</main>
<script>
(()=>{'use strict';
 const book=document.getElementById('book'),cover=document.getElementById('cover'),replay=document.getElementById('replay');
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
 let audioContext=null, scenes=[],animations=[],timers=[],run=0;
 function schedule(fn,ms){const thisRun=run;timers.push(setTimeout(()=>{if(run===thisRun)fn();},ms));}
 function clearScenes(){
   run++;timers.forEach(clearTimeout);timers=[];
   animations.forEach(a=>{try{a.cancel()}catch(e){}});animations=[];
   scenes.forEach(n=>n.remove());scenes=[];
 }
 function soundPop(delaySec=0){
   // オーディオの再生開始を、クリックされた瞬間に予約する（iPhone対策）。
   try{
     const AudioCtx=window.AudioContext||window.webkitAudioContext;
     if(!AudioCtx)return;
     if(!audioContext)audioContext=new AudioCtx();
     if(audioContext.state==='suspended')audioContext.resume();
     const at=audioContext.currentTime+delaySec+.025;
     const osc=audioContext.createOscillator(),gain=audioContext.createGain();
     osc.type='triangle';osc.frequency.setValueAtTime(710,at);osc.frequency.exponentialRampToValueAtTime(160,at+.24);
     gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(.3,at+.019);gain.gain.exponentialRampToValueAtTime(.0001,at+.28);
     osc.connect(gain);gain.connect(audioContext.destination);osc.start(at);osc.stop(at+.30);
     const n=audioContext.createBuffer(1,Math.ceil(audioContext.sampleRate*.24),audioContext.sampleRate);
     const ch=n.getChannelData(0);
     for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/ch.length,1.6);
     const noise=audioContext.createBufferSource(),ng=audioContext.createGain();noise.buffer=n;
     ng.gain.setValueAtTime(.0001,at);ng.gain.exponentialRampToValueAtTime(.15,at+.012);ng.gain.exponentialRampToValueAtTime(.0001,at+.25);
     noise.connect(ng);ng.connect(audioContext.destination);noise.start(at);noise.stop(at+.26);
   }catch(e){/* 音が鳴らなくてもアニメーションは続きます */}
 }
 function animate(element,frames,opts){const a=element.animate(frames,opts);animations.push(a);return a;}
 function addScene(n){document.body.appendChild(n);scenes.push(n);return n;}
 let cakeFly=null;
 function cakeFlight(){
   const source=book.querySelector('.cake-entry .cake-bob'),r=source.getBoundingClientRect();
   if(!r.width){book.classList.add('cake-settled');return;}
   const layer=addScene(document.createElement('div'));layer.className='burst-layer';cakeFly=layer;
   const figure=source.cloneNode(true);figure.className='burst-figure';
   figure.querySelectorAll('.flame').forEach(el=>el.remove());
   figure.style.left=r.left+'px';figure.style.top=r.top+'px';figure.style.width=r.width+'px';
   layer.appendChild(figure);
   const dx=innerWidth*.63-(r.left+r.width/2);
   const dy=innerHeight*.46-(r.top+r.height/2);
   // ケーキを少し右に寄せて、左手のクラッカーが見えるようにする。
   const peak=Math.min(2.55,Math.max(1.85,innerWidth*1.12/Math.max(1,r.width)));
   const duration=4130;
   const flight=animate(figure,[
     {offset:0,opacity:0,transform:`translate(${dx}px,${dy+150}px) scale(.3) rotate(-12deg)`},
     {offset:.19,opacity:1,transform:`translate(${dx}px,${dy}px) scale(${peak*1.05}) rotate(3deg)`},
     {offset:.40,opacity:1,transform:`translate(${dx}px,${dy}px) scale(${peak}) rotate(-1deg)`},
     {offset:.74,opacity:1,transform:`translate(${dx}px,${dy}px) scale(${peak}) rotate(2deg)`},
     {offset:.89,opacity:1,transform:'translate(0,0) scale(1.10) rotate(-2deg)'},
     {offset:1,opacity:1,transform:'translate(0,0) scale(1) rotate(0deg)'}
   ],{duration,easing:'ease-in-out',fill:'both'});
   const thisRun=run;
   flight.onfinish=()=>{if(run!==thisRun)return;book.classList.add('cake-settled');layer.remove();cakeFly=null;};
 }
 function partyPop(){
   // 飛び出したケーキの『左手に持ったクラッカー』の口から紙吹雪を飛ばす。
   const cracker=cakeFly?.querySelector('.cake-cracker');
   const r=cracker?.getBoundingClientRect();
   const x=r?Math.max(25,Math.min(innerWidth-28,r.left+r.width*.84)):innerWidth*.39;
   const y=r?Math.max(30,Math.min(innerHeight-50,r.top+r.height*.18)):innerHeight*.33;
   const layer=addScene(document.createElement('div'));layer.className='party-layer';
   const flash=document.createElement('div');flash.className='pop-flash';flash.style.left=x+'px';flash.style.top=y+'px';layer.appendChild(flash);
   const colors=['#ff8cba','#ffdd51','#8fd7ff','#adf3c8','#cfacf7','#fff7bd','#ffad74','#ef78b8'];
   for(let i=0;i<136;i++){
     const el=document.createElement('i');el.className='confetti-piece';el.style.left=x+'px';el.style.top=y+'px';
     const w=5+Math.random()*8,h=7+Math.random()*12;
     el.style.width=w+'px';el.style.height=h+'px';el.style.backgroundColor=colors[i%colors.length];
     el.style.borderRadius=i%5===0?'50%':'2px';layer.appendChild(el);
     const midX=(Math.random()*.99+.005)*innerWidth-x;
     const midY=(Math.random()*.81+.035)*innerHeight-y;
     const drift=(Math.random()-.5)*85,spin=(Math.random()>.5?1:-1)*(360+Math.random()*850);
     const endY=innerHeight-y+80+Math.random()*120;
     animate(el,[
       {offset:0,opacity:0,transform:'translate(0px,0px) scale(.3) rotate(0deg)'},
       {offset:.09,opacity:1,transform:`translate(${midX*.20}px,${midY*.24-35}px) scale(1.25) rotate(${spin*.16}deg)`},
       {offset:.40,opacity:1,transform:`translate(${midX}px,${midY}px) scale(1) rotate(${spin*.48}deg)`},
       {offset:.78,opacity:.97,transform:`translate(${midX+drift*.7}px,${endY*.75}px) scale(.85) rotate(${spin*.78}deg)`},
       {offset:1,opacity:0,transform:`translate(${midX+drift}px,${endY}px) scale(.7) rotate(${spin}deg)`}
     ],{duration:3000+Math.random()*1700,delay:Math.random()*130,fill:'forwards',easing:'cubic-bezier(.19,.57,.28,1)'});
   }
   schedule(()=>layer.remove(),5400);
 }
 function pomPeek(){book.classList.add('pom-peek');}
 function pomFlight(){
   const source=book.querySelector('.pom-entry img'),r=source.getBoundingClientRect();
   if(!r.width){book.classList.add('pom-settled');return;}
   const layer=addScene(document.createElement('div'));layer.className='burst-layer';layer.style.zIndex='190';
   const halo=document.createElement('div');halo.className='pom-glow';layer.appendChild(halo);
   const pic=source.cloneNode(true);pic.className='pom-fly';pic.style.left=r.left+'px';pic.style.top=r.top+'px';pic.style.width=r.width+'px';layer.appendChild(pic);
   const dx=innerWidth*.50-(r.left+r.width/2),dy=innerHeight*.47-(r.top+r.height/2);
   const peak=Math.min(4.1,Math.max(2.6,Math.min(innerWidth*.98/r.width,innerHeight*.80/r.height)));
   const a=animate(pic,[
     {offset:0,opacity:1,transform:'translate(0,0) scale(1) rotate(8deg)'},
     {offset:.24,opacity:1,transform:`translate(${dx}px,${dy}px) scale(${peak*1.1}) rotate(-8deg)`},
     {offset:.42,opacity:1,transform:`translate(${dx}px,${dy}px) scale(${peak}) rotate(6deg)`},
     {offset:.72,opacity:1,transform:`translate(${dx}px,${dy}px) scale(${peak*.96}) rotate(-3deg)`},
     {offset:.90,opacity:1,transform:'translate(0,0) scale(1.14) rotate(13deg)'},
     {offset:1,opacity:1,transform:'translate(0,0) scale(1) rotate(0deg)'}
   ],{duration:2600,fill:'both',easing:'ease-in-out'});
   animate(halo,[{opacity:0},{offset:.18,opacity:1},{offset:.75,opacity:.8},{opacity:0}],{duration:2600,fill:'both'});
   const thisRun=run;a.onfinish=()=>{if(run!==thisRun)return;book.classList.add('pom-settled');layer.remove();};
 }
 function start(){
   clearScenes();
   book.classList.remove('opened','cake-settled','pom-peek','pom-settled');
   replay.style.animation='none';void replay.offsetWidth;replay.style.animation='';void book.offsetWidth;
   book.classList.add('opened');
   if(reduced.matches){book.classList.add('cake-settled','pom-settled');return;}
   // 1 ケーキ → 2 クラッカー＋紙吹雪 → 3 ケーキが縮む → 4 プリンが飛び出す → 5 メッセージ
   soundPop(2.38);
   schedule(cakeFlight,540);
   schedule(partyPop,2400);
   schedule(pomPeek,6520);
   schedule(pomFlight,7460);
 }
 cover.addEventListener('click',start);replay.addEventListener('click',start);
})();
</script></body></html>
