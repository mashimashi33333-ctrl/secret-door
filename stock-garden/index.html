<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./icon.svg"><link rel="apple-touch-icon" href="./icon.svg"></head>
<body>
<div id="app"><div class="loading"><div class="loading-orb">✧</div><p>ストックの庭をひらいています…</p></div></div>
<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script>'use strict';
const ROOM_TEMPLATES=[
 {name:'トイレ',type:'toilet'}, {name:'お風呂',type:'bath'}, {name:'洗面所',type:'wash'},
 {name:'キッチン',type:'kitchen'}, {name:'洗濯',type:'laundry'}, {name:'コスメ',type:'cosmetics'},
 {name:'玄関',type:'entrance'}, {name:'お掃除',type:'cleaning'}
];
const ART_TYPES=[...ROOM_TEMPLATES.map(r=>r.type),'custom'];
const UNITS=['パック','本','個','袋','箱','セット','枚','その他'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const nowDate=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};

const byId=(arr,id)=>arr.find(x=>x.id===id);
const roomById=id=>byId(db.rooms,id),itemById=id=>byId(db.items,id);
const itemEvents=itemId=>db.events.filter(e=>e.itemId===itemId);
const delta=e=>e.type==='purchase'?e.qty:e.type==='use'?-e.qty:e.type==='adjust'?e.qty:0;
const stock=i=>i.base+itemEvents(i.id).reduce((s,e)=>s+delta(e),0);
const status=i=>stock(i)===0?'red':stock(i)===1?'yellow':'blue';
const roomStatus=r=>{const arr=db.items.filter(i=>i.roomId===r.id);return arr.some(i=>status(i)==='red')?'red':arr.some(i=>status(i)==='yellow')?'yellow':'blue'};
const lowItems=()=>db.items.filter(i=>stock(i)<=1);
const avgDays=i=>{
 const dates=[...new Set(itemEvents(i.id).filter(e=>e.type==='use'||e.type==='opening').map(e=>e.date))].sort();
 if(dates.length<2)return null;
 const intervals=[];for(let k=1;k<dates.length;k++){const n=daysBetween(dates[k-1],dates[k]);if(n>0)intervals.push(n)}
 return intervals.length?Math.round(intervals.reduce((a,b)=>a+b,0)/intervals.length):null;
};
const lastEvent=(itemId,types)=>itemEvents(itemId).filter(e=>types.includes(e.type)).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt))[0];
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window))return reject(new Error('IndexedDB unavailable'));let r=indexedDB.open('stock-garden-db',1);r.onupgradeneeded=()=>{r.result.createObjectStore('data')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
let idb;
async function load(){try{idb=await openDB();const snap=await new Promise((resolve,reject)=>{const q=idb.transaction('data').objectStore('data').get('snapshot');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});if(snap&&Array.isArray(snap.rooms)&&Array.isArray(snap.items)&&Array.isArray(snap.events))db=snap;}catch(err){storageOK=false;console.warn('Storage unavailable:',err)}render();if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('./service-worker.js').catch(()=>{})}
function persist(){if(!storageOK||!idb){notify('この環境では端末保存できません。公開したPWAで試してね');return Promise.resolve()}
 const data=JSON.parse(JSON.stringify(db));persistTail=persistTail.then(()=>new Promise((resolve,reject)=>{const tx=idb.transaction('data','readwrite');tx.objectStore('data').put(data,'snapshot');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})).catch(e=>{console.warn('Save failed',e);notify('保存に失敗しました。端末の空き容量を確認してね')});return persistTail;
}
function notify(message,undoId=null){const root=$('#toast-root');if(toastTimeout)clearTimeout(toastTimeout);root.innerHTML=`<div class="toast"><span>${esc(message)}</span>${undoId?`<button data-action="undo-use" data-id="${esc(undoId)}">取り消す</button>`:''}</div>`;toastTimeout=setTimeout(()=>root.innerHTML='',5200)}
function go(next,room=null,item=null){view=next;if(room!==null)currentRoom=room;if(item!==null)currentItem=item;modal=null;render();scrollTo({top:0,behavior:'instant'})}
function render(){document.body.classList.toggle('modal-open',!!modal);if(!db.started){renderOnboarding();return}
 const warning=lowItems().length;
 $('#app').innerHTML=`<main class="shell">
 <header class="app-header"><div><div class="brand-meta">✧ LITTLE STOCK GARDEN ✧</div><h1 class="brand-title">ストックの庭</h1></div><div class="header-right"><button class="icon-circle" aria-label="アイテムを追加" data-action="add-item" title="アイテムを追加">${icon('plus')}</button><button class="icon-circle" aria-label="設定" data-nav="settings">${icon('settings')}</button></div></header>
 ${view==='map'?mapView(warning):view==='room'?roomView():view==='item'?itemView():view==='history'?historyView():view==='analysis'?analysisView():settingsView()}
 </main><nav class="tabbar" aria-label="メインメニュー"><div class="tabs">${[['map','map','マップ'],['history','clock','履歴'],['analysis','chart','分析'],['settings','settings','設定']].map(([k,g,label])=>`<button class="tab ${view===k?'active':''}" data-nav="${k}">${icon(g)}<span>${label}</span></button>`).join('')}</div></nav>`;
 renderModal();
}
function terrainMarkup(height){const h=height;let nodes='';for(let i=0;i<45;i++){const x=18+(i*79)%323,y=97+(i*123)%(h-150),r=i%5===0?8:3+(i%4);nodes+=i%3===0?`<path d="M${x-r} ${y}l${r} ${-r*2} ${r} ${r*2} ${r} ${r} ${-r*2} ${r*2} ${-r} ${-r*2}z" fill="#fff" opacity=".82"/>`:`<circle cx="${x}" cy="${y}" r="${r}" fill="${i%2?'#ffffff':'#97cce9'}" opacity=".52"/>`}
 let path='M 177 88';const rows=Math.max(1,Math.ceil((db.rooms.length+1)/2));for(let j=0;j<rows;j++){const y=180+j*195;path+=` C ${j%2?75:280} ${y-30}, ${j%2?280:75} ${y+55}, 177 ${y+120}`}
 let bushes='';for(let i=0;i<rows+2;i++){const y=158+i*190;for(let k=0;k<3;k++){const x=k===0?15:k===1?338:170;const rad=k===2?14:25;bushes+=`<ellipse cx="${x}" cy="${y+(k%2)*40}" rx="${rad}" ry="${rad/2}" fill="#c8e5f3" opacity=".65"/><circle cx="${x+5}" cy="${y-7+(k%2)*40}" r="7" fill="#a2cde6" opacity=".7"/>`}}
 return `<svg class="terrain" aria-hidden="true" viewBox="0 0 360 ${h}" preserveAspectRatio="none"><defs><linearGradient id="earth" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e6f3fd"/></linearGradient></defs><path d="M 39 82 Q 3 123 32 218 Q 5 312 27 397 Q 4 ${h*.59} 32 ${h*.69} Q 12 ${h-70} 73 ${h-42} Q 165 ${h+5} 292 ${h-38} Q 355 ${h-78} 325 ${h*.63} Q 351 ${h*.47} 323 ${h*.33} Q 357 170 311 78 Q 206 38 103 60 Z" fill="url(#earth)" opacity=".83" stroke="#fff" stroke-width="3"/><path d="${path}" fill="none" stroke="#d6e7e7" stroke-width="25" stroke-linecap="round" opacity=".8"/><path d="${path}" fill="none" stroke="#f8faf0" stroke-width="18" stroke-linecap="round" opacity=".94" stroke-dasharray="2 4"/>${bushes}${nodes}</svg>`;
}
function mapView(warning){const n=db.rooms.length;const total=n+1;const rows=Math.ceil(total/2);const h=Math.max(470,112+rows*196+75);const severe=db.items.filter(i=>stock(i)===0).length;let locs=db.rooms.map((r,i)=>{const y=95+Math.floor(i/2)*196+(i%2?25:0);const left=i%2?53:2;const c=roomStatus(r),alert=c==='blue'?'':`<span class="map-alert ${c}">!</span>`;return `<button class="map-location" data-action="open-room" data-id="${esc(r.id)}" style="left:${left}%;top:${y}px" aria-label="${esc(r.name)}のストックを見る"><img src="${asset(r.type)}" alt=""><span class="map-nameplate"><span>${esc(r.name)}</span>${c==='blue'?'':`<i class="dot ${c}" style="margin:0"></i>`}</span>${alert}</button>`}).join('');const at=n,y=100+Math.floor(at/2)*196+(at%2?25:0),left=at%2?53:2;
 return `<div class="hero-message"><div class="hero-symbol">✦</div><div><strong>${warning?`ストックの見回り：${warning}点をチェック！`:'今日もストックの庭は平和です'}</strong><span>${severe?`予備なし ${severe}点。マップの赤い印を見てね。`:'建物をタップして、予備の数を確認しよう。'}</span></div></div><div class="legend"><span><i class="dot"></i>じゅうぶん</span><span><i class="dot yellow"></i>残り1</span><span><i class="dot red"></i>予備なし</span></div>
 <div class="island-map" style="height:${h}px">${terrainMarkup(h)}<div class="map-overline">✦ YOUR LITTLE WORLD ✦</div><div class="map-top-title">おうちのストックマップ</div>${locs}<button class="map-add" style="left:${left}%;top:${y+10}px" data-action="add-room"><i>＋</i><span>場所を追加</span></button></div>
 <p class="map-footnote">✧ おうちの場所は、いつでも増やせるよ ✧</p>${n===0?`<div class="empty-panel"><h3>まずは場所を作ろう</h3><button class="button" data-action="add-room">場所を追加</button></div>`:''}`;
}
function roomView(){const r=roomById(currentRoom);if(!r)return '<div class="empty-panel">場所が見つかりません</div>';const items=db.items.filter(i=>i.roomId===r.id),severity=items.filter(i=>stock(i)<=1).length;
 return `<div class="page-head"><button class="back" data-nav="map" aria-label="マップに戻る">${icon('back')}</button><div class="grow"><div class="eyebrow">STOCK WORLD / ${esc(r.type.toUpperCase())}</div><h2>${esc(r.name)}</h2></div><button class="button small soft" data-action="add-item" data-id="${esc(r.id)}">${icon('plus')} アイテム</button></div>
 <section class="room-hero"><span class="room-banner">✧ ${esc(r.name)}のアイテムショップ ✧</span><img src="${asset(r.type)}" alt="${esc(r.name)}のミニチュア建物"></section>
 <div class="ribbon">✦ アイテム棚 ✦</div>
 ${items.length?`<div class="shelf">${items.map(i=>itemTile(i)).join('')}</div>`:`<div class="empty-panel"><div class="empty-symbol">✦</div><strong>この棚はまだ空っぽ</strong><p>ここで使う消耗品を追加しよう。</p><button class="button" data-action="add-item" data-id="${esc(r.id)}">アイテムを登録</button></div>`}
 ${severity?`<p class="foot-note">※ 注意マークのアイテムが ${severity} 点あるよ。</p>`:'<p class="foot-note">※ 在庫は「未開封の予備」の数だよ。</p>'}`;
}
function itemTile(i){const s=status(i),num=stock(i);return `<button class="item-tile" data-action="open-item" data-id="${esc(i.id)}"><div class="item-art">${i.image?`<img src="${i.image}" alt="">`:fallbackArt(i)}</div><span class="item-title">${esc(i.name)}</span><span class="count-pill ${s}">予備 ${num} ${esc(i.unit)}</span></button>`}
function itemView(){const i=itemById(currentItem);if(!i)return '<div class="empty-panel">商品が見つかりません</div>';const r=roomById(i.roomId),num=stock(i),s=status(i),avg=avgDays(i),p=lastEvent(i.id,['purchase']),u=lastEvent(i.id,['use','opening']);const recent=itemEvents(i.id).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt)).slice(0,4);
 return `<div class="page-head"><button class="back" data-action="back-room" aria-label="場所に戻る">${icon('back')}</button><div class="grow"><div class="eyebrow">ITEM COLLECTION</div><h2>アイテム詳細</h2></div><button class="button small soft" data-action="edit-item" data-id="${esc(i.id)}">${icon('edit')} 編集</button></div>
 <div class="item-header"><div class="item-portrait">${i.image?`<img src="${i.image}" alt="${esc(i.name)}">`:fallbackArt(i)}</div><div class="item-info"><div class="eyebrow">${esc(r?r.name:'場所なし')} / ${i.cosmetic?'COSMETICS':'STOCK'}</div><h2>${esc(i.name)}</h2><div class="item-sub">1 ${esc(i.unit)}単位で管理</div></div></div>
 <div class="stock-panel ${s}"><div class="summary-line"><div><div class="eyebrow">未開封の予備</div><div class="stock-big">${num}<small>${esc(i.unit)}</small></div></div><span class="count-pill ${s}">${s==='red'?'予備なし':s==='yellow'?'残り1':'予備あり'}</span></div></div>
 <div class="action-grid"><button class="button" data-action="use-now" data-id="${esc(i.id)}" ${num<=0?'disabled':''}>${icon('minus')} ${i.cosmetic?'予備を開封':'予備を使う'}</button><button class="button soft" data-action="purchase" data-id="${esc(i.id)}">${icon('bag')} 購入を記録</button></div>
 <div style="text-align:center"><button class="button ghost small" data-action="use-past" data-id="${esc(i.id)}" ${num<=0?'disabled':''}>${icon('calendar')} 過去の日付で使用を記録</button></div>
 <div class="metric-row"><div class="metric"><small>1 ${esc(i.unit)}あたりの消耗ペース</small><strong>${avg?'約 '+avg+' 日':'まだ集計中'}</strong></div><div class="metric"><small>最後の購入</small><strong>${p?niceDate(p.date):'未記録'}</strong></div><div class="metric"><small>${i.cosmetic?'最近の開封日':'前回の使用開始日'}</small><strong>${u?niceDate(u.date):'未記録'}</strong></div><div class="metric"><small>記録された使用回数</small><strong>${itemEvents(i.id).filter(e=>e.type==='use'||e.type==='opening').reduce((a,e)=>a+(e.qty||1),0)} 回</strong></div></div>
 <div class="timeline"><div class="summary-line"><strong>✧ このアイテムの履歴</strong><button class="button small soft" data-action="adjust" data-id="${esc(i.id)}">実在庫に合わせる</button></div><div class="divider"></div>${recent.length?recent.map(e=>historyRow(e,false)).join(''):'<p class="text-muted tiny">まだ記録はありません。</p>'}</div>
 <p class="foot-note">${i.cosmetic?'開封日の間隔':'予備を使い始めた日の間隔'}から消耗ペースを推定。実際の使い切り日ではないため、目安として見てね。</p>`;
}
function eventLabel(e){return e.type==='purchase'?'購入':e.type==='use'?(itemById(e.itemId)?.cosmetic?'開封':'予備を使った'):e.type==='opening'?'開封日を記録':'在庫を調整'}
function historyRow(e,showItem=true){const i=itemById(e.itemId);if(!i)return '';const qty=delta(e);let display=e.type==='opening'?'開封日':`${qty>0?'+':''}${qty} ${esc(i.unit)}`;return `<div class="history-row"><div class="history-symbol">${icon(e.type==='purchase'?'bag':e.type==='adjust'?'edit':'box')}</div><div class="history-row-main"><div class="history-row-title">${showItem?esc(i.name)+' · ':''}${eventLabel(e)}</div><div class="history-row-sub">${niceDate(e.date)} / ${esc(roomById(i.roomId)?.name||'')}</div></div><div class="history-row-right"><div class="history-qty ${qty<0?'down':''}">${display}</div><button class="button ghost small" data-action="edit-event" data-id="${esc(e.id)}" aria-label="履歴を編集">編集</button></div></div>`}
function historyView(){let list=db.events.filter(e=>itemById(e.itemId)).filter(e=>historyFilter==='all'||e.type===historyFilter||(historyFilter==='use'&&e.type==='opening')).sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));return `<div class="page-head"><div><div class="eyebrow">ADVENTURE LOG</div><h2>ストックの記録</h2><p>購入や使用の日付を、あとから直せるよ。</p></div></div><div class="chips">${[['all','すべて'],['purchase','購入'],['use','使用・開封'],['adjust','在庫調整']].map(([k,l])=>`<button class="chip ${historyFilter===k?'selected':''}" data-filter="${k}">${l}</button>`).join('')}</div><div class="history-list">${list.length?list.map(e=>historyRow(e)).join(''):'<div class="empty-panel"><div class="empty-symbol">✧</div><strong>まだ記録がないよ</strong><p>アイテムを登録して、使い始めよう。</p></div>'}</div>`}
function analysisView(){const arr=db.items.map(i=>({item:i,avg:avgDays(i)})).sort((a,b)=>(a.avg===null?1:0)-(b.avg===null?1:0));return `<div class="page-head"><div><div class="eyebrow">CONSUMPTION DIARY</div><h2>消耗ペースの図鑑</h2><p>ひとつの予備がどのくらいもつか、記録から見るよ。</p></div></div><div class="hero-message"><div class="hero-symbol">⌛</div><div><strong>使用開始日の間隔で計算</strong><span>同じ商品で2回以上、異なる日に記録すると目安が表示されるよ。</span></div></div>${arr.length?arr.map(({item:i,avg})=>{const date=lastEvent(i.id,['use','opening']);return `<div class="analysis-card" role="button" tabindex="0" data-action="open-item" data-id="${esc(i.id)}"><div class="summary-line"><div><h3>${esc(i.name)}</h3><p>${esc(roomById(i.roomId)?.name||'')} · 予備 ${stock(i)} ${esc(i.unit)}</p></div><span class="count-pill ${status(i)}">${avg?'約 '+avg+' 日':'集計中'}</span></div><div class="analysis-stat"><span class="text-muted tiny">${i.cosmetic?'最近の開封':'直近の使用開始'}</span><strong style="font-size:14px">${date?niceDate(date.date):'—'}</strong></div></div>`}).join(''):'<div class="empty-panel">アイテムを登録すると、ここに並ぶよ。</div>'}<p class="foot-note">まとめ買いや並行使用の影響で、表示は実際の消費日数と異なる場合があるよ。</p>`}
function settingsView(){return `<div class="page-head"><div><div class="eyebrow">THE GARDEN TOOLS</div><h2>お庭の設定</h2></div></div>
 <div class="setting-group"><h3>✧ 場所の管理</h3><p>建物を増やしたり、名前や見た目を変更できるよ。</p>${db.rooms.map((r,index)=>`<div class="setting-row"><span>${esc(r.name)}</span><div class="setting-actions"><button class="button small soft" data-action="move-room" data-id="${esc(r.id)}" data-dir="-1" ${index===0?'disabled':''}>↑</button><button class="button small soft" data-action="move-room" data-id="${esc(r.id)}" data-dir="1" ${index===db.rooms.length-1?'disabled':''}>↓</button><button class="button small soft" data-action="edit-room" data-id="${esc(r.id)}">編集</button></div></div>`).join('')}<button class="button soft small" style="margin-top:10px" data-action="add-room">${icon('plus')} 場所を追加</button></div>
 <div class="setting-group"><h3>✧ バックアップ</h3><p>データと商品写真をJSONファイルに保存・復元するよ。建物のイラストはアプリ本体に入っているよ。</p><div class="setting-actions"><button class="button small" data-action="export">${icon('download')} 保存する</button><button class="button small soft" data-action="import">${icon('upload')} 復元する</button></div><input id="import-file" hidden type="file" accept="application/json,.json"></div>
 <div class="setting-group"><h3>✧ おためし・整理</h3><p>最初は空っぽで始めるよ。デモデータを入れると画面の雰囲気を確認できるよ。</p><div class="setting-actions"><button class="button small soft" data-action="demo" ${db.items.length?'disabled':''}>デモ商品を追加</button><button class="button small danger" data-action="reset">データをすべて削除</button></div></div>
 <p class="foot-note">ログイン・料金・購入店情報なし。データはこの端末のブラウザ内だけに保存されるよ。ホーム画面に追加するとPWAとして使えるよ。</p>`}
function modalWrap(title,body){return `<div class="modal-cover" data-cover="1"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="handle"></div><div class="modal-head"><h2>${esc(title)}</h2><button class="modal-close" data-action="close-modal" aria-label="閉じる">×</button></div>${body}</div></div>`}
function field(name,label,type,value='',attrs=''){return `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${attrs}></div>`}
function selectField(name,label,options,value){return `<div class="field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${options.map(([v,l])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`}
function itemForm(item=null,room=null){const edit=!!item,rid=item?.roomId||room||currentRoom||db.rooms[0]?.id||'';stagedPhoto=undefined;return modalWrap(edit?'アイテムを編集':'アイテムを登録',`<form data-form="item" data-id="${esc(item?.id||'')}">

 <div class="pair">${selectField('roomId','使う場所',db.rooms.map(r=>[r.id,r.name]),rid)}${selectField('unit','管理単位',UNITS.map(s=>[s,s]),item?.unit||'パック')}</div>
 ${!edit?`<div class="pair">${field('base','今ある予備の数','number','0','required min="0" max="9999" step="1"')}<div class="field"><label>数える単位</label><div class="hint">12ロール入りでも「1パック」として登録できるよ。</div></div></div>`:'<div class="hint">予備の実数を変更したいときは、アイテム詳細の「実在庫に合わせる」を使ってね。</div>'}

 <div class="field"><label class="label-check"><input type="checkbox" name="cosmetic" id="cosmetic-flag" ${item?.cosmetic?'checked':''}> 化粧品として管理（使用を「開封」と記録）</label></div>
 ${!edit?`<div id="initial-open-date" style="display:none">${field('openingDate','使用中の化粧品の開封日（任意）','date','','max="'+nowDate()+'"')}<div class="fine-print">今使っている1本は予備に含めず、開封日だけ残せるよ。</div></div>`:''}
 <div class="form-actions">${edit?`<button type="button" class="button danger" data-action="delete-item" data-id="${esc(item.id)}">削除</button>`:''}<button class="button" type="submit">${edit?'変更を保存':'登録する'}</button></div></form>`)}
function roomForm(room=null){return modalWrap(room?'場所を編集':'場所を追加',`<form data-form="room" data-id="${esc(room?.id||'')}">${field('name','場所の名前','text',room?.name||'','required maxlength="22" placeholder="例：玄関・パントリー"')}${selectField('type','建物のデザイン',ART_TYPES.map(k=>[k,ROOM_TEMPLATES.find(r=>r.type===k)?.name||'おうち（汎用）']),room?.type||'custom')}<div class="hint">新しい場所には白×青の建物を配置するよ。マップは自動的に広がるよ。</div><div class="form-actions">${room?`<button type="button" class="button danger" data-action="delete-room" data-id="${esc(room.id)}">削除</button>`:''}<button type="submit" class="button">${room?'変更を保存':'場所を作る'}</button></div></form>`)}

 if(kind==='use')return modalWrap(i.cosmetic?'開封日を記録':'使用開始日を記録',`<form data-form="use" data-id="${esc(i.id)}"><div class="hint">予備から1 ${esc(i.unit)}使うよ。日付は過去にも変更できるよ。</div>${field('date',i.cosmetic?'開封した日':'予備を使い始めた日','date',nowDate(),'required max="'+nowDate()+'"')}<div class="form-actions"><button class="button full" type="submit">この日付で記録（−1）</button></div></form>`);
 return modalWrap('実在庫に合わせる',`<form data-form="adjust" data-id="${esc(i.id)}"><div class="hint">履歴は残したまま、実際に棚にある予備数に合わせるよ。</div>${field('date','確認した日','date',nowDate(),'required max="'+nowDate()+'"')}${field('stock','実際の予備の数','number',stock(i),'required min="0" max="9999" step="1"')}<div class="form-actions"><button class="button full" type="submit">在庫を修正する</button></div></form>`);
}
function eventForm(e){const i=itemById(e.itemId);const qtyfield=e.type==='opening'?'':field('qty',e.type==='adjust'?'調整の増減（マイナス可）':'数量','number',e.qty,`required step="1" ${e.type==='adjust'?'min="-9999" max="9999"':'min="1" max="9999"'}`);return modalWrap('記録を編集',`<form data-form="event" data-id="${esc(e.id)}"><div class="hint">${esc(i?.name||'')} · ${eventLabel(e)}</div>${field('date','日付','date',e.date,'required max="'+nowDate()+'"')}${qtyfield}<div class="form-actions"><button type="button" class="button danger" data-action="delete-event" data-id="${esc(e.id)}">削除</button><button class="button" type="submit">変更を保存</button></div></form>`)}
function renderModal(){const root=$('#sheet-root');if(!root)return;root.innerHTML='';if(!modal){document.body.classList.remove('modal-open');return}document.body.classList.add('modal-open');let html='';if(modal.type==='item')html=itemForm(modal.id?itemById(modal.id):null,modal.roomId);else if(modal.type==='room')html=roomForm(modal.id?roomById(modal.id):null);else if(modal.type==='event')html=eventForm(byId(db.events,modal.id));else {const i=itemById(modal.id);if(i)html=operationForm(modal.type,i)}root.innerHTML=html;if(modal.type==='item'){const flag=$('#cosmetic-flag');if(flag)syncCosmeticFlag()}}
function syncCosmeticFlag(){const el=$('#initial-open-date'),flag=$('#cosmetic-flag');if(el&&flag)el.style.display=flag.checked?'block':'none'}
function renderOnboarding(){document.body.classList.remove('modal-open');const app=$('#app');app.innerHTML=`<div class="onboarding"><div class="welcome-card"><div class="eyebrow" style="text-align:center">✧ WELCOME TO YOUR STOCK WORLD ✧</div><img class="welcome-illustration" src="${asset('custom')}" alt="白と青のおうち"><h1>小さなストックの庭へ</h1><p class="lead">あなたのおうちの場所を選んで、<br>自分だけの箱庭マップをつくろう。</p><div class="ornament">✦</div><div class="checkbox-grid">${ROOM_TEMPLATES.map(r=>`<label class="place-choice"><img src="${asset(r.type)}" alt=""><span>${esc(r.name)}</span><input type="checkbox" data-onboard="${esc(r.name)}" ${onboardingSelections.includes(r.name)?'checked':''}></label>`).join('')}</div>
 <div class="field"><label>ほかの場所も追加できるよ</label><div style="display:flex;gap:8px"><input id="custom-place" placeholder="例：寝室" maxlength="22"><button class="button soft" data-action="onboard-add">追加</button></div></div>${onboardingCustom.length?`<div class="chips">${onboardingCustom.map(n=>`<button class="chip selected" data-action="onboard-remove" data-name="${esc(n)}">${esc(n)} ×</button>`).join('')}</div>`:''}<button class="button full" data-action="onboard-start" ${onboardingSelections.length+onboardingCustom.length===0?'disabled':''}>この場所で庭をつくる ✦</button><p class="foot-note" style="text-align:center">あとから増やしたり、名前を変えたりできるよ。</p></div></div>`;$('#sheet-root').innerHTML='';}
function startGarden(){const names=[...onboardingSelections,...onboardingCustom];if(!names.length)return notify('場所を1つ以上選んでね');db.rooms=names.map(name=>({id:uid(),name,type:ROOM_TEMPLATES.find(r=>r.name===name)?.type||'custom'}));db.started=true;persist();go('map')}
function isValidDate(date){return /^\d{4}-\d{2}-\d{2}$/.test(date)&&date<=nowDate()&&!Number.isNaN(new Date(date+'T12:00:00').getTime())}
function canApplyEvent(itemId,exclude=null,candidate=null){const i=itemById(itemId);if(!i)return false;const total=i.base+db.events.filter(e=>e.itemId===itemId&&e.id!==exclude).reduce((s,e)=>s+delta(e),0)+(candidate?delta(candidate):0);return total>=0&&Number.isInteger(total)}
function doUse(i,date,showUndo=true){if(stock(i)<=0)return notify('予備が0だから使用を記録できないよ');if(!isValidDate(date))return notify('日付を確認してね');const e={id:uid(),itemId:i.id,type:'use',qty:1,date,createdAt:new Date().toISOString()};db.events.push(e);persist();modal=null;render();notify('予備を1 '+i.unit+' 使った記録を保存したよ',showUndo?e.id:null)}
function readForm(form){return Object.fromEntries(new FormData(form).entries())}
async function processPhoto(file){if(!file||!file.type.startsWith('image/'))throw Error('画像ファイルを選んでね');if(file.size>15*1024*1024)throw Error('画像が大きすぎるよ（15MBまで）');const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});const max=256,ratio=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*ratio));c.height=Math.max(1,Math.round(img.naturalHeight*ratio));const cx=c.getContext('2d');cx.fillStyle='#ffffff';cx.fillRect(0,0,c.width,c.height);cx.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/webp',.78)}finally{URL.revokeObjectURL(url)}}
function submitForm(form){const type=form.dataset.form,values=readForm(form),id=form.dataset.id,date=values.date;
 if(type==='room'){const name=String(values.name||'').trim();if(!name)return notify('場所の名前を入れてね');if(db.rooms.some(r=>r.name===name&&r.id!==id))return notify('同じ名前の場所があるよ');if(id){const r=roomById(id);if(!r)return;r.name=name;r.type=ART_TYPES.includes(values.type)?values.type:'custom'}else db.rooms.push({id:uid(),name,type:ART_TYPES.includes(values.type)?values.type:'custom'});persist();modal=null;render();notify('場所を保存したよ');return}
 if(type==='item'){const name=String(values.name||'').trim();if(!name)return notify('商品名を入れてね');if(!roomById(values.roomId))return notify('場所を選んでね');let i=id?itemById(id):null;if(id&&!i)return;const isCosmetic=!!form.querySelector('[name=cosmetic]')?.checked;
  if(!id){const base=Number(values.base);if(!Number.isInteger(base)||base<0||base>9999)return notify('予備数を確認してね');if(isCosmetic&&values.openingDate&&!isValidDate(values.openingDate))return notify('開封日を確認してね');i={id:uid(),name,roomId:values.roomId,unit:UNITS.includes(values.unit)?values.unit:'個',base,cosmetic:isCosmetic,image:'',createdAt:new Date().toISOString()};db.items.push(i);if(isCosmetic&&values.openingDate){db.events.push({id:uid(),itemId:i.id,type:'opening',qty:0,date:values.openingDate,createdAt:new Date().toISOString()})}}
  else {i.name=name;i.roomId=values.roomId;i.unit=UNITS.includes(values.unit)?values.unit:'個';i.cosmetic=isCosmetic}
  if(stagedPhoto!==undefined)i.image=stagedPhoto||'';persist();modal=null;view='room';currentRoom=i.roomId;render();notify(id?'アイテムを更新したよ':'アイテムを登録したよ');return}
 const i=itemById(id);if(type==='event'){const e=byId(db.events,id);if(!e)return;if(!isValidDate(date))return notify('日付を確認してね');const q=e.type==='opening'?0:Number(values.qty);if(!Number.isInteger(q)||(e.type!=='adjust'&&e.type!=='opening'&&q<=0)||Math.abs(q)>9999)return notify('数量を確認してね');const next={...e,date,qty:q};if(!canApplyEvent(e.itemId,e.id,next))return notify('予備がマイナスになっちゃうよ。ほかの履歴も確認してね');Object.assign(e,next);persist();modal=null;render();notify('記録を変更したよ');return}
 if(!i)return;if(!isValidDate(date))return notify('日付を確認してね');if(type==='purchase'){const qty=Number(values.qty);if(!Number.isInteger(qty)||qty<1||qty>9999)return notify('購入数を確認してね');db.events.push({id:uid(),itemId:i.id,type:'purchase',qty,date,createdAt:new Date().toISOString()});persist();modal=null;render();notify('購入を記録したよ');return}
 if(type==='use'){doUse(i,date,false);return}
 if(type==='adjust'){const actual=Number(values.stock);if(!Number.isInteger(actual)||actual<0||actual>9999)return notify('予備数を確認してね');const diff=actual-stock(i);if(diff===0){modal=null;render();return notify('在庫数に変更はないよ')}db.events.push({id:uid(),itemId:i.id,type:'adjust',qty:diff,date,createdAt:new Date().toISOString()});persist();modal=null;render();notify('在庫を実数に合わせたよ')}
}
function openModal(next){modal=next;renderModal()}
function handleAction(btn){const action=btn.dataset.action,id=btn.dataset.id,i=itemById(id);switch(action){
 case 'add-room':openModal({type:'room'});return;
 case 'edit-room':openModal({type:'room',id});return;
 case 'add-item':if(!db.rooms.length)return notify('先に場所を作ってね');openModal({type:'item',roomId:id||currentRoom});return;
 case 'edit-item':openModal({type:'item',id});return;
 case 'open-room':go('room',id);return;
 case 'open-item':go('item',null,id);return;
 case 'back-room':go('room',i?i.roomId:currentRoom);return;
 case 'purchase':if(i)openModal({type:'purchase',id});return;
 case 'use-now':if(i)doUse(i,nowDate(),true);return;
 case 'use-past':if(i)openModal({type:'use',id});return;
 case 'adjust':if(i)openModal({type:'adjust',id});return;
 case 'close-modal':modal=null;renderModal();return;
 case 'remove-photo':stagedPhoto='';$('#photo-preview').innerHTML=icon('camera');return;
 case 'undo-use':{const e=byId(db.events,id);if(!e||e.type!=='use')return;db.events=db.events.filter(x=>x.id!==id);persist();render();notify('使用記録を取り消したよ');return}
 case 'edit-event':openModal({type:'event',id});return;
 case 'delete-event':{const e=byId(db.events,id);if(!e)return;if(!canApplyEvent(e.itemId,e.id))return notify('この履歴を消すと在庫がマイナスになるよ');if(!confirm('この記録を削除しますか？'))return;db.events=db.events.filter(v=>v.id!==id);persist();modal=null;render();notify('記録を削除したよ');return}
 case 'delete-item':{if(!i)return;if(!confirm('「'+i.name+'」と、この商品の履歴をすべて削除しますか？'))return;db.items=db.items.filter(x=>x.id!==id);db.events=db.events.filter(x=>x.itemId!==id);persist();modal=null;view='room';currentRoom=i.roomId;render();notify('アイテムを削除したよ');return}
 case 'delete-room':{const r=roomById(id);if(!r)return;if(db.items.some(x=>x.roomId===id))return notify('この場所には商品があるよ。先にほかの場所に移してね');if(!confirm('「'+r.name+'」をマップから削除しますか？'))return;db.rooms=db.rooms.filter(x=>x.id!==id);persist();modal=null;render();notify('場所を削除したよ');return}
 case 'move-room':{const index=db.rooms.findIndex(r=>r.id===id),next=index+Number(btn.dataset.dir);if(index<0||next<0||next>=db.rooms.length)return;[db.rooms[index],db.rooms[next]]=[db.rooms[next],db.rooms[index]];persist();render();return}
 case 'export':exportBackup();return;
 case 'import':$('#import-file')?.click();return;
 case 'demo':addDemo();return;
 case 'reset':{if(!confirm('商品・履歴・場所・写真をすべて削除します。バックアップが必要なら先に保存してね。削除しますか？'))return;db={version:1,started:false,rooms:[],items:[],events:[]};modal=null;onboardingSelections=['トイレ','お風呂','洗面所','キッチン','コスメ'];onboardingCustom=[];persist();view='map';render();return}
 case 'onboard-add':{const name=$('#custom-place')?.value.trim();if(!name||name.length>22)return;if([...onboardingSelections,...onboardingCustom,...ROOM_TEMPLATES.map(r=>r.name)].includes(name))return notify('同じ名前の場所があるよ');onboardingCustom.push(name);render();return}
 case 'onboard-remove':onboardingCustom=onboardingCustom.filter(x=>x!==btn.dataset.name);render();return;
 case 'onboard-start':startGarden();return;
 }}
function exportBackup(){const out=JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2);const blob=new Blob([out],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='stock-garden-'+nowDate()+'.json';a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('バックアップを保存したよ')}
async function importBackup(file){if(!file)return;if(file.size>40*1024*1024)return notify('バックアップが大きすぎるよ（40MBまで）');try{const payload=JSON.parse(await file.text());if(payload.version!==1||!Array.isArray(payload.items)||!Array.isArray(payload.rooms)||!Array.isArray(payload.events)||payload.items.length>10000||payload.rooms.length>200||payload.events.length>100000)throw Error('形式が違うよ');for(const r of payload.rooms)if(typeof r.id!=='string'||typeof r.name!=='string'||typeof r.type!=='string')throw Error('場所の形式が不正だよ');for(const i of payload.items)if(typeof i.id!=='string'||typeof i.name!=='string'||!Number.isInteger(i.base)||i.base<0||typeof i.image!=='string'||(i.image&&!/^data:image\/(webp|png|jpeg);base64,/.test(i.image)))throw Error('商品形式が不正だよ');for(const e of payload.events)if(!['purchase','use','adjust','opening'].includes(e.type)||!Number.isInteger(e.qty)||typeof e.date!=='string'||!isValidDate(e.date))throw Error('履歴形式が不正だよ');if(!confirm('現在のデータを、バックアップで完全に置き換えますか？'))return;db={version:1,started:true,rooms:payload.rooms,items:payload.items,events:payload.events};persist();view='map';modal=null;render();notify('バックアップを復元したよ')}catch(err){notify('読み込めなかったよ：'+err.message)}finally{const input=$('#import-file');if(input)input.value=''}}
function addDemo(){if(db.items.length)return;if(!confirm('画面の雰囲気を確認するためのサンプル商品を追加しますか？（あとで削除できます）'))return;const samples=[['トイレ','エリエール ダブル','パック',1,false],['お風呂','シャンプー','本',1,false],['お風呂','ボディソープ','本',0,false],['キッチン','食器用洗剤','本',2,false],['洗面所','ハンドソープ','本',1,false],['コスメ','化粧水','本',1,true]];for(const [roomName,name,unit,base,cosmetic]of samples){const r=db.rooms.find(r=>r.name===roomName);if(!r)continue;const id=uid();db.items.push({id,name,unit,base,roomId:r.id,cosmetic,image:'',createdAt:new Date().toISOString()});}persist();render();notify('サンプル商品を追加したよ')}
document.addEventListener('click',e=>{if(e.target.dataset.cover==='1'){modal=null;renderModal();return}const nav=e.target.closest('[data-nav]');if(nav){go(nav.dataset.nav);return}const filter=e.target.closest('[data-filter]');if(filter){historyFilter=filter.dataset.filter;render();return}const action=e.target.closest('[data-action]');if(action)handleAction(action)});
document.addEventListener('change',async e=>{const t=e.target;if(t.matches('[data-onboard]')){const name=t.dataset.onboard;if(t.checked){if(!onboardingSelections.includes(name))onboardingSelections.push(name)}else onboardingSelections=onboardingSelections.filter(n=>n!==name);render();return}if(t.id==='cosmetic-flag'){syncCosmeticFlag();return}if(t.id==='photo-upload'){if(!t.files?.length)return;const photo=$('#photo-preview');if(photo)photo.innerHTML='<span class="tiny text-muted">変換中…</span>';try{stagedPhoto=await processPhoto(t.files[0]);if(photo)photo.innerHTML=`<img src="${stagedPhoto}" alt="写真のプレビュー">`}catch(err){notify(err.message);if(photo)photo.innerHTML=icon('camera')}return}if(t.id==='import-file')await importBackup(t.files?.[0])});
document.addEventListener('submit',e=>{const form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();submitForm(form)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;renderModal()}if(e.key==='Enter'&&e.target.matches('[role=button][data-action=open-item]'))handleAction(e.target)});
load();
</script>
</body>
</html>
